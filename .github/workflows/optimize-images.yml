name: Optimize site images to WebP

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tools/optimize_images.py"
      - ".github/workflows/optimize-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Optimize site images to WebP'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install --upgrade Pillow requests
      - name: Convert every page image to WebP
        run: python tools/optimize_images.py
      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Optimize site images to WebP"
            git push
          fi
